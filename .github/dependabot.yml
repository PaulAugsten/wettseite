version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule: { interval: weekly }
      open-pull-requests-limit: 10
      cooldown:
        default-days: 3
      groups:
          # Package families that must stay on matching versions.
          vitest:
              patterns: ["vitest", "@vitest/*"]
          next:
              patterns: ["next", "@next/*", "eslint-config-next"]
          react:
              patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
          tailwind:
              patterns: ["tailwindcss", "@tailwindcss/*"]
          size-limit:
              patterns: ["size-limit", "@size-limit/*"]
          commitlint:
              patterns: ["@commitlint/*"]
          semantic-release:
              patterns: ["semantic-release", "@semantic-release/*"]
          minor-and-patch:
              update-types: ["minor", "patch"]
      ignore:
          # Don't auto-bump the framework major; review those by hand.
          - dependency-name: "next"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@next/*"
            update-types: ["version-update:semver-major"]
          - dependency-name: "eslint-config-next"
            update-types: ["version-update:semver-major"]
    - package-ecosystem: github-actions
      directory: "/"
      schedule: { interval: weekly }
