name: Uptime smoke test

# Synthetic check against production: catches outages that only show up live
# (DNS, CDN, Supabase connectivity) which preview/CI builds never exercise.
on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: uptime-smoke-test
    cancel-in-progress: true

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - name: Run smoke test against production
              run: pnpm exec playwright test e2e/smoke.spec.ts --project=chromium
              env:
                  BASE_URL: ${{ vars.PRODUCTION_URL }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: uptime-smoke-report
                  path: playwright-report/
                  retention-days: 7
