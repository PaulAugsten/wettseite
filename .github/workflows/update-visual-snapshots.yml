name: Update visual snapshots

# Visual baselines (e2e/visual.spec.ts-snapshots/) must be captured against a real deployed preview, not a local build. Run this manually from the Actions tab with the PR's preview URL (Vercel's bot comments it on the PR) whenever a UI change makes the baselines stale.
on:
    workflow_dispatch:
        inputs:
            preview_url:
                description: Preview deployment URL (from the Vercel bot's PR comment)
                required: true
                type: string

# The push authenticates with CI_AUTOMATION_TOKEN
permissions:
    contents: read

jobs:
    update-snapshots:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
            options: --ipc=host
        steps:
            - name: Refuse to run on the default branch
              if: github.ref_name == github.event.repository.default_branch
              run: |
                  echo "::error::Dispatch this workflow from the PR branch (the 'Use workflow from' dropdown), not '${GITHUB_REF_NAME}' as pushes to it are blocked by branch protection."
                  exit 1
            - uses: actions/checkout@v7
              with:
                  # Keep credentials off disk while dependencies install and tests run
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
              env:
                  BASE_URL: ${{ inputs.preview_url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
                  HOME: /root
            - name: Commit updated snapshots
              env:
                  PUSH_TOKEN: ${{ secrets.CI_AUTOMATION_TOKEN }}
              run: |
                  # The workspace bind mount is owned by the host runner user, not the container's root, so git refuses it until it's marked safe.
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  git config user.name "PaulAugsten"
                  git config user.email "58978786+PaulAugsten@users.noreply.github.com"
                  git add e2e/visual.spec.ts-snapshots
                  git diff --cached --quiet || git commit -m "test: update visual regression snapshots"
                  git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
