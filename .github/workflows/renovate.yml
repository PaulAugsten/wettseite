name: Renovate

# Config: .github/renovate.json5.
# Deliberately has no pull_request trigger: fork PRs must never reach this token.
on:
    schedule:
        # Every 2h on Mondays: later passes rebase PRs left behind main by an earlier automerge
        - cron: "0 */2 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: renovate
    cancel-in-progress: false

jobs:
    renovate:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
              with:
                  token: ${{ secrets.CI_AUTOMATION_TOKEN }}
              env:
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  RENOVATE_GIT_AUTHOR: PaulAugsten <58978786+PaulAugsten@users.noreply.github.com>
