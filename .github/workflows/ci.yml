name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm lint:next

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck

    knip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm knip

    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:coverage
            - name: Upload coverage
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: true

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
              env:
                  NEXT_TELEMETRY_DISABLED: '1'
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    # Flat budget check against this build's own output (see .size-limit.json)
    bundle-size:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
              env:
                  NEXT_TELEMETRY_DISABLED: '1'
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            - run: pnpm size

    # Runs semantic-release after CI passes on an actual push to main
    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [lint, typecheck, knip, unit, build, bundle-size]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        # A release in progress must never be cancelled mid-push by a newer commit landing on main
        concurrency:
            group: release-main
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  # Deploy key with write access, added to the ruleset's bypass list, so the release commit can push straight to main
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with: { node-version-file: .nvmrc, cache: pnpm }
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: PaulAugsten
                  GIT_AUTHOR_EMAIL: 58978786+PaulAugsten@users.noreply.github.com
                  GIT_COMMITTER_NAME: PaulAugsten
                  GIT_COMMITTER_EMAIL: 58978786+PaulAugsten@users.noreply.github.com

    # The `production` GitHub Environment (required reviewers, wait timer, scoped secrets) gates this job. Vercel's own auto-deploy for main is disabled via vercel.json so this is the only path a production deploy can take. Preview deploys for other branches/PRs still happen automatically through Vercel's Git integration.
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [lint, typecheck, knip, unit, build, bundle-size]
        runs-on: ubuntu-latest
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - run: npx vercel@64.3.1 deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
