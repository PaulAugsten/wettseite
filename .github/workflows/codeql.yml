name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        # Catch issues introduced by changes to CodeQL's own query packs, not just code changes.
        - cron: "20 5 * * 1"

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@v7

            - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
              with:
                  languages: javascript-typescript

            - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
              with:
                  category: "/language:javascript-typescript"
