name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        # Catch issues introduced by changes to CodeQL's own query packs, not just code changes.
        - cron: "20 5 * * 1"

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
              with:
                  languages: javascript-typescript

            - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
              with:
                  category: "/language:javascript-typescript"
